<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Idle Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
        }

        button {
            padding: 8px 12px;
            margin-right: 6px;
        }

        .box {
            padding: 16px;
            border: 1px solid #ccc;
            margin-top: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h2>Idle Login Test</h2>

    <label>Base API URL</label>
    <input id="baseUrl" value="https://localhost:7193" />

    <label>JWT Token</label>
    <input id="token" placeholder="Paste token dari login di sini" />

    <button onclick="saveToken()">Save Token</button>
    <button onclick="keepAlive()">Manual Keep Alive</button>
    <button onclick="clearToken()">Clear Token</button>

    <div class="box">
        <h3>Status</h3>
        <p>Idle countdown: <b id="counter">50</b> detik</p>
        <p>Last activity: <span id="lastActivity">-</span></p>
        <p>Last keep alive: <span id="lastKeepAlive">-</span></p>
        <p>JWT expiration: <span id="expiration">-</span></p>
        <p>Status: <span id="status">-</span></p>
    </div>

    <script>const IDLE_LIMIT_SECONDS = 50;
        const KEEP_ALIVE_MIN_GAP_MS = 2000;

        let remaining = IDLE_LIMIT_SECONDS;
        let countdownInterval = null;
        let lastKeepAliveAt = 0;

        function nowText() {
            return new Date().toLocaleTimeString();
        }

        function getBaseUrl() {
            return document.getElementById("baseUrl").value.replace(/\/$/, "");
        }

        function getToken() {
            return localStorage.getItem("token");
        }

        function saveToken() {
            const token = document.getElementById("token").value;

            if (!token) {
                alert("Token masih kosong.");
                return;
            }

            localStorage.setItem("token", token);
            document.getElementById("status").innerText = "Token disimpan.";
        }

        function clearToken() {
            localStorage.removeItem("token");
            localStorage.removeItem("expiration");
            document.getElementById("token").value = "";
            document.getElementById("expiration").innerText = "-";
            document.getElementById("status").innerText = "Token dihapus.";
        }

        function resetIdleTimer() {
            remaining = IDLE_LIMIT_SECONDS;
            document.getElementById("counter").innerText = remaining;
            document.getElementById("lastActivity").innerText = nowText();

            const gap = Date.now() - lastKeepAliveAt;

            if (gap >= KEEP_ALIVE_MIN_GAP_MS) {
                keepAlive();
            }
        }

        async function keepAlive() {
            const token = getToken();

            if (!token) {
                document.getElementById("status").innerText = "Token belum ada.";
                return;
            }

            lastKeepAliveAt = Date.now();

            try {
                const response = await fetch(`${getBaseUrl()}/api/Auth/keep-alive?setCookie=true`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    credentials: "include"
                });

                if (!response.ok) {
                    document.getElementById("status").innerText = `Keep alive gagal: ${response.status}`;
                    return;
                }

                const result = await response.json();

                if (result.token) {
                    localStorage.setItem("token", result.token);
                    document.getElementById("token").value = result.token;
                }

                if (result.expiration) {
                    localStorage.setItem("expiration", result.expiration);
                    document.getElementById("expiration").innerText = result.expiration;
                }

                document.getElementById("lastKeepAlive").innerText = nowText();
                document.getElementById("status").innerText = result.message ?? "Session diperpanjang.";
            } catch (err) {
                document.getElementById("status").innerText = "Error: " + err.message;
            }
        }

        function logoutLocal() {
            clearToken();
            document.getElementById("status").innerText = "Idle habis. User dianggap logout di frontend.";
        }

        function startCountdown() {
            clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                remaining--;
                document.getElementById("counter").innerText = remaining;

                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    logoutLocal();
                }
            }, 1000);
        }

        ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(eventName => {
            window.addEventListener(eventName, resetIdleTimer);
        });

        document.getElementById("token").value = getToken() ?? "";
        document.getElementById("expiration").innerText = localStorage.getItem("expiration") ?? "-";

        resetIdleTimer();
        startCountdown();</script>
</body>
</html>
