name: QuilvianSystemBackendDevQuilvianDev
on:
  push:
    branches:
      - QuilvianDev  # Sesuaikan dengan branch utama Anda

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup SSH Connection
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY_BACKEND }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_IP_BACKEND }} >> ~/.ssh/known_hosts

    - name: Deploy to Server
      run: |
        ssh ${{ secrets.SSH_USER_BACKEND }}@${{ secrets.SSH_IP_BACKEND }} << 'EOF'

          cd ~/QuilvianSystemBackendDev-QuilvianDev

          echo "Resetting local changes..."
          git reset --hard origin/QuilvianDev
          git clean -fd

          echo "Pulling latest changes..."
          git pull origin QuilvianDev

          IMAGE_NAME="quilvian-backend-quilviandev"
          CONTAINER_NAME="quilvian-container-quilviandev"

          DEPLOY_TIME=$(date +"%A, %d-%m-%Y %H:%M:%S") 

          echo "Building new Docker image..."
          docker build -t $IMAGE_NAME .

          echo "Stopping and removing old container..."
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

          echo "Checking if container exists..."
          if [ "$(docker ps -a -q -f name=$CONTAINER_NAME)" ]; then
            echo "Container exists, restarting..."
            docker restart $CONTAINER_NAME
          else
            echo "Container does not exist, creating a new one..."

            docker run -d --name $CONTAINER_NAME -p 80:80 $IMAGE_NAME
          fi

          echo "Cleaning up unused Docker images..."
          docker system prune -af

          echo "Deployment completed!"


          # Kirim notifikasi ke Telegram setelah update
          curl -X POST "https://api.telegram.org/bot7630899059:AAFqAUGUB7I5V9VGKXbcmoWmbYWvrdmnje8/sendMessage" \
              -d chat_id=-1002437306112 \
              -d text="âœ… Deployment Sukses! ðŸš€
              *Docker Image:* $IMAGE_NAME
              *Container:* $CONTAINER_NAME
              *Tanggal:* $DEPLOY_TIME%0A
              Deployment dilakukan Backend Branch *quilviandev*%0A
              ðŸ”„ Container telah diperbarui dan berjalan dengan baik. ðŸŽ‰"
        EOF
