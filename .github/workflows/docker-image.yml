name: QuilvianSta-Deploy
on:
  push:
    branches:
      - QuilvianSta  # Branch utama sekarang

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup SSH Connection
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY_BACKEND_PRO }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_IP_BACKEND_PRO }} >> ~/.ssh/known_hosts

    - name: Deploy to Server
      run: |
        ssh ${{ secrets.SSH_USER_BACKEND }}@${{ secrets.SSH_IP_BACKEND_PRO }} << 'EOF'

          cd ~/QuilvianSta

          echo "Resetting local changes..."
          git reset --hard origin/QuilvianSta
          git clean -fd

          echo "Pulling latest changes..."
          git pull origin QuilvianSta

          IMAGE_NAME="quilviansta-backend"
          CONTAINER_NAME="quilviansta-container"

          DEPLOY_TIME=$(date +"%A, %d-%m-%Y %H:%M:%S") 

          echo "Building new Docker image (no cache)..."
          docker build --no-cache -t $IMAGE_NAME .

          echo "Stopping old container..."
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

          echo "Running new container..."
          docker run -d \
            --name $CONTAINER_NAME \
            -p 4000:80 \
            --memory="3g" \
            --memory-swap="3g" \
            --restart unless-stopped \
            $IMAGE_NAME


          echo "Cleaning up unused Docker images..."
          docker system prune -af

          echo "Deployment completed!"

          PUSHER="${{ github.actor }}"
          
          # Kirim notifikasi ke Telegram setelah update
          curl -X POST "https://api.telegram.org/bot7630899059:AAFqAUGUB7I5V9VGKXbcmoWmbYWvrdmnje8/sendMessage" \
              -d chat_id=-1002437306112 \
              -d text="✅ Deployment Sukses! 🚀
              *Docker Image:* $IMAGE_NAME
              *Container:* $CONTAINER_NAME
              *Tanggal:* $DEPLOY_TIME%0A
              Deployment dilakukan Backend Branch *$PUSHER*%0A
              🔄 Container telah diperbarui dan berjalan dengan baik. 🎉"

        EOF
