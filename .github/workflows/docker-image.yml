name: QuilvianSta-Deploy

on:
  push:
    branches:
      - QuilvianSta
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: quilvian-backend-staging-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/devbenari/quilviansystembackenddev
  IMAGE_TAG: staging

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build context size
        run: |
          echo "Repository size:"
          du -sh .
          echo "Top largest files/folders:"
          du -ah . | sort -rh | head -30

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_BACKEND }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_IP_BACKEND }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh "${{ secrets.SSH_USER_BACKEND }}@${{ secrets.SSH_IP_BACKEND }}" << 'EOF'
            set -e

            echo "=== SSH DEBUG ==="
            echo "User:"
            whoami

            echo "Hostname:"
            hostname

            echo "Current directory:"
            pwd

            echo "Docker version:"
            docker --version
            docker compose version

            echo "=== Check /opt ==="
            ls -la /opt

            echo "=== Check /opt/QuilvianStaging ==="
            ls -la /opt/QuilvianStaging

            echo "=== Check deploy.sh ==="
            ls -la /opt/QuilvianStaging/deploy.sh
            bash -n /opt/QuilvianStaging/deploy.sh

            echo "=== Run deploy ==="
            bash /opt/QuilvianStaging/deploy.sh
          EOF
