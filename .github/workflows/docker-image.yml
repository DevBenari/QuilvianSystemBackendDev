        ssh ecustomer@160.20.104.98 << 'EOF'  # Ganti 'user' dan IP sesuai kebutuhan
          cd ~/QuilvianSystemBackendDev-yasmina
          git reset --hard origin/yasmina
          git clean -fd
          git pull --depth=1 origin yasmina
          docker build --cache-from=quilvian-backend-yasmina -t quilvian-backend-yasmina .
          docker restart quilvian-container || docker run -d --name quilvian-container-yasmina -p 5002:80 quilvian-backend-yasmina
          docker image prune -f
          echo "Deployment completed!"
        EOF
