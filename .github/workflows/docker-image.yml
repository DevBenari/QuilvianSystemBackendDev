name: QuilvianSystemBackendDevYasmine
on:
  push:
    branches:
      - yasmina  # Sesuaikan dengan branch utama Anda
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup SSH Connection
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY_BACKEND }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_IP_BACKEND }} >> ~/.ssh/known_hosts

    - name: Deploy to Server
      run: |
        ssh ${{ secrets.SSH_USER_BACKEND }}@${{ secrets.SSH_IP_BACKEND }} << 'EOF'
          cd ~/QuilvianSystemBackendDev-yasmina

          echo "Resetting local changes..."
          git reset --hard origin/yasmina
          git clean -fd

          echo "Pulling latest changes..."
          git pull origin yasmina

          echo "Building new Docker image..."
          docker build -t quilvian-backend-yasmina .

          echo "Stopping and removing old container..."
          docker stop quilvian-container-yasmina || true
          docker rm quilvian-container-yasmina || true

          echo "Running new container..."
          docker restart quilvian-container-yasmina || docker run -d --name quilvian-container-yasmina -p 5002:80 quilvian-backend-yasmina

          echo "Cleaning up unused Docker images..."
          docker system prune -af

          echo "Deployment completed!"
        EOF
