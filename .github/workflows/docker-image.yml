name: Deploy Quilvian Backend Dev
on:
  push:
    branches:
      - QuilvianDev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY_BACKEND }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_IP_BACKEND }} >> ~/.ssh/known_hosts

    - name: Deploy to Server
      run: |
        ssh ${{ secrets.SSH_USER_BACKEND }}@${{ secrets.SSH_IP_BACKEND }} << 'EOF'
          APP_DIR=~/QuilvianSystemBackendDev-QuilvianDev
          IMAGE_NAME="quilvian-backend-quilviandev"
          CONTAINER_NAME="quilvian-container-quilviandev"
          TELEGRAM_BOT_TOKEN="7630899059:AAFqAUGUB7I5V9VGKXbcmoWmbYWvrdmnje8"
          TELEGRAM_CHAT_ID="-1002437306112"

          cd $APP_DIR || exit 1

          echo "➡ Reset & pull latest code..."
          git reset --hard origin/QuilvianDev
          git clean -fd -e appsettings.json
          git pull origin QuilvianDev

          echo "➡ Stop & remove old container if exists..."
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

          echo "➡ Remove old image if exists..."
          OLD_IMAGE=$(docker images -q $IMAGE_NAME)
          if [ -n "$OLD_IMAGE" ]; then
              docker rmi -f $OLD_IMAGE
          fi

          echo "➡ Build new Docker image..."
          nice -n 10 docker build -t $IMAGE_NAME .

          echo "➡ Run new container..."
          docker run -d --name $CONTAINER_NAME \
            -p 8081:80 \
            --memory="1g" --memory-swap="1g" \
            --cpus="1.0" \
            --restart unless-stopped \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -v /opt/quilvian/config/appsettings.json:/app/appsettings.json:ro \
            $IMAGE_NAME

          echo "➡ Cleanup dangling images..."
          docker system prune -af

          DEPLOY_TIME=$(date +"%A, %d-%m-%Y %H:%M:%S")
          PUSHER="${{ github.actor }}"

          echo "➡ Send Telegram notification..."
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=$TELEGRAM_CHAT_ID \
            -d text="✅ Deployment Sukses! 🚀
            *Docker Image:* $IMAGE_NAME
            *Container:* $CONTAINER_NAME
            *Tanggal:* $DEPLOY_TIME
            Deployment dilakukan Backend Branch *$PUSHER* 🎉"
        EOF


