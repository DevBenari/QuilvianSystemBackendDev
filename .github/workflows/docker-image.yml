name: Build and Push Docker image to Docker Hub

on:
  push:
    branches:
      - QuilvianDev  # Workflow ini akan berjalan setiap ada perubahan di branch 'QuilvianDev'

jobs:
  build:
    runs-on: ubuntu-latest  # Workflow ini akan dijalankan di Ubuntu terbaru

    env:
      DOCKER_USERNAME: "ikbalyuliyanto7"  # Ganti dengan username Docker Hub Anda
      DOCKER_PASSWORD: "dckr_pat_zIxZcT42yuw5GqAwGLSgn4lnCGk"  # Ganti dengan password atau token Docker Hub Anda

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Login ke Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin

      # Step 3: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ikbalyuliyanto7/quilvian-postgre-api:latest .

      # Step 4: Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ikbalyuliyanto7/quilvian-postgre-api:latest
